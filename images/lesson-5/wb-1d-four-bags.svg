<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc">
<title id="title">Four collections of everyday things, A to D</title>
<desc id="desc">A: a mobile phone, a packaged sandwich and a water bottle. B: a laptop, a mobile phone and a wallet. C: a tote bag, a notebook and two mobile phones. D: a laptop, an American passport and a notebook.</desc>
<defs>
 <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f8fbfd"/></linearGradient>
 <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#d3e0e9"/><stop offset="1" stop-color="#a8bece"/></linearGradient>
 <symbol id="phone" viewBox="0 0 100 180">
  <rect x="9" y="3" width="82" height="172" rx="19" fill="#273e50" stroke="#162e40" stroke-width="5"/>
  <rect x="15" y="23" width="70" height="128" rx="4" fill="url(#screen)"/>
  <rect x="38" y="12" width="24" height="3" rx="2" fill="#d9e6ec"/>
  <rect x="24" y="39" width="52" height="24" rx="6" fill="#e7eff2"/><rect x="24" y="72" width="22" height="15" rx="3" fill="#edf2f5"/><rect x="52" y="72" width="24" height="15" rx="3" fill="#edf2f5"/>
  <rect x="24" y="93" width="52" height="6" rx="2" fill="#738da0"/><rect x="24" y="109" width="40" height="6" rx="2" fill="#738da0"/>
  <circle cx="50" cy="163" r="6" fill="#a2b9c8"/>
 </symbol>
 <symbol id="water" viewBox="0 0 125 225">
  <rect x="43" y="12" width="38" height="20" rx="3" fill="#7993a3" stroke="#587284" stroke-width="3"/>
  <path d="M44 32 L82 32 Q85 50 95 68 Q109 103 105 188 Q103 210 82 210 L43 210 Q22 209 20 188 Q15 102 30 68 Q40 49 44 32 Z" fill="#e8f5fb" stroke="#67879b" stroke-width="5"/>
  <path d="M35 80 Q63 97 94 80" fill="none" stroke="#b1cbd7" stroke-width="5"/>
  <rect x="25" y="113" width="76" height="50" rx="3" fill="#b9d3df"/>
  <text x="63" y="144" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#33596b">WATER</text>
  <path d="M38 180 C65 195 88 174 98 185" fill="none" stroke="#a8c8d8" stroke-width="4"/>
 </symbol>
 <symbol id="sandwich" viewBox="0 0 164 204">
  <path d="M21 23 L137 10 L147 186 L14 187 Z" fill="#e6eef3" stroke="#688095" stroke-width="5"/>
  <path d="M22 56 L137 43 L139 96 L20 103 Z" fill="#3f596c"/>
  <text x="81" y="69" transform="rotate(-5 81 69)" text-anchor="middle" fill="white" font-size="15" font-weight="bold" font-family="Arial,sans-serif">SALAD</text>
  <text x="81" y="87" transform="rotate(-5 81 87)" text-anchor="middle" fill="white" font-size="13" font-weight="bold" font-family="Arial,sans-serif">SANDWICH</text>
  <path d="M31 130 L63 112 L102 141 L135 130 M31 150 L69 130 L107 159 L136 148" fill="none" stroke="#8ba784" stroke-width="10" opacity=".7"/>
 </symbol>
 <symbol id="laptop" viewBox="0 0 290 232">
  <rect x="20" y="12" width="248" height="167" rx="13" fill="#3a4e60" stroke="#1b2c3d" stroke-width="6"/>
  <rect x="34" y="26" width="220" height="139" rx="4" fill="url(#screen)"/>
  <path d="M34 26 L254 26 L87 165 L34 165 Z" fill="#edf5fa" opacity=".48"/>
  <circle cx="144" cy="18" r="3" fill="#b6c6d1"/>
  <path d="M16 178 L272 178 L285 204 Q286 213 275 216 L11 216 Q2 214 6 206Z" fill="#72899a" stroke="#41576a" stroke-width="5"/>
  <path d="M110 184 L181 184 L190 196 L98 196Z" fill="#d0e0ea"/>
 </symbol>
 <symbol id="wallet" viewBox="0 0 132 94">
  <rect x="5" y="15" width="122" height="69" rx="11" fill="#4d6574" stroke="#314a5c" stroke-width="5"/>
  <rect x="7" y="33" width="118" height="44" rx="8" fill="#668398"/>
  <path d="M93 40 L126 40 L126 66 L93 66 Q81 54 93 40" fill="#375369"/>
  <circle cx="101" cy="52" r="4" fill="#dce7ee"/>
 </symbol>
 <symbol id="tote" viewBox="0 0 292 265">
  <path d="M56 74 Q60 5 114 13 Q158 18 161 73 M150 74 Q157 13 203 13 Q253 18 253 78" fill="none" stroke="#657f90" stroke-width="18" stroke-linecap="round"/>
  <path d="M25 79 L267 79 L284 238 Q283 255 260 255 L31 255 Q14 251 12 232 Z" fill="#c2d2dc" stroke="#658297" stroke-width="6"/>
  <path d="M38 104 L260 104" stroke="#e9f0f4" stroke-width="6"/>
  <path d="M190 147 Q216 108 237 155 Q251 194 215 221" fill="none" stroke="#8ea6b4" stroke-width="14" opacity=".6"/>
 </symbol>
 <symbol id="notebook" viewBox="0 0 126 170">
  <rect x="11" y="10" width="107" height="150" rx="5" fill="#fafafa" stroke="#658398" stroke-width="5"/>
  <path d="M30 45 L101 45 M30 68 L101 68 M30 91 L101 91 M30 114 L101 114 M30 137 L101 137" stroke="#b8cbd4" stroke-width="3"/>
  <path d="M12 17 L12 156" stroke="#8ca3b4" stroke-width="6" stroke-dasharray="5 11"/>
  <path d="M26 4 v19 M46 4 v19 M66 4 v19 M86 4 v19 M106 4 v19" stroke="#415c6f" stroke-width="6" stroke-linecap="round"/>
 </symbol>
 <symbol id="passport" viewBox="0 0 119 166">
  <rect x="8" y="6" width="105" height="154" rx="9" fill="#2e5068" stroke="#18344a" stroke-width="5"/>
  <rect x="19" y="17" width="83" height="129" rx="2" fill="none" stroke="#aec0ca" stroke-width="2"/>
  <text x="61" y="37" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.2" fill="#e1e8ee">PASSPORT</text>
  <circle cx="61" cy="78" r="20" fill="none" stroke="#c8d5df" stroke-width="3"/>
  <path d="M44 78 H78 M61 60 V96 M51 65 Q63 80 51 91 M70 65 Q57 80 70 91" fill="none" stroke="#c8d5df" stroke-width="2"/>
  <text x="61" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#e1e8ee">UNITED STATES</text>
 </symbol>
</defs>
<rect width="1000" height="900" rx="20" fill="#edf3f6"/>
<g fill="url(#paper)" stroke="#bbcbd4" stroke-width="3">
<rect x="22" y="18" width="468" height="422" rx="20"/><rect x="510" y="18" width="468" height="422" rx="20"/>
<rect x="22" y="460" width="468" height="422" rx="20"/><rect x="510" y="460" width="468" height="422" rx="20"/>
</g>
<g fill="#2c5b75"><circle cx="69" cy="66" r="30"/><circle cx="557" cy="66" r="30"/><circle cx="69" cy="508" r="30"/><circle cx="557" cy="508" r="30"/></g>
<g fill="white" text-anchor="middle" font-size="31" font-weight="bold" font-family="Arial,sans-serif"><text x="69" y="77">A</text><text x="557" y="77">B</text><text x="69" y="519">C</text><text x="557" y="519">D</text></g>
<!-- A: phone, sandwich, water bottle -->
<use xlink:href="#phone" x="60" y="215" width="122" height="210"/>
<use xlink:href="#sandwich" x="187" y="138" width="165" height="215"/>
<use xlink:href="#water" x="350" y="150" width="124" height="232"/>
<!-- B: laptop, phone and wallet -->
<use xlink:href="#laptop" x="585" y="127" width="315" height="250"/>
<use xlink:href="#phone" x="519" y="255" width="92" height="162"/>
<use xlink:href="#wallet" x="810" y="330" width="142" height="95"/>
<!-- C: tote, notebook and two phones -->
<use xlink:href="#tote" x="48" y="535" width="291" height="296"/>
<use xlink:href="#notebook" x="317" y="633" width="124" height="193"/>
<use xlink:href="#phone" x="245" y="748" width="65" height="116"/>
<use xlink:href="#phone" x="416" y="743" width="65" height="116"/>
<!-- D: laptop, passport and notebook -->
<use xlink:href="#laptop" x="566" y="551" width="315" height="250"/>
<use xlink:href="#passport" x="659" y="719" width="97" height="138"/>
<use xlink:href="#notebook" x="821" y="689" width="130" height="177"/>
</svg>
